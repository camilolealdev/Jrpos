# Pyrefly — resuelve imports contra el venv del proyecto, no el Python global.
# (backend/.venv tiene sqlalchemy, fastapi, bcrypt, etc. instalados por requirements.txt)
# Documentación: https://pyrefly.org/en/docs/configuration/

project-includes = ["."]
project-excludes = [
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "**/*inmemory*/**",
    "**/.*/**",
    "**/.venv/**"
]
use-ignore-files = true

[interpreter]
interpreters = [".venv/Scripts/python.exe"]
